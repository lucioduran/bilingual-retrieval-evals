[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bilingual-retrieval-evals"
version = "0.1.0"
description = "Traceable local retrieval evaluation by language and query family"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = []

[project.scripts]
bilingual-retrieval = "bilingual_retrieval.cli:main"

[tool.setuptools.packages.find]
include = ["bilingual_retrieval*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.coverage.run]
branch = true
source = ["bilingual_retrieval"]

[tool.coverage.report]
show_missing = true
fail_under = 90
